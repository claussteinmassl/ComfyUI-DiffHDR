[project]
name = "comfyui-diffhdr"
description = "DiffHDR (LDR to HDR reconstruction for images, videos and HDRI panoramas) on ComfyUI's native Wan2.1-VACE."
version = "0.3.1"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["OpenEXR>=3.3", "huggingface_hub"]

[project.urls]
Repository = "https://github.com/claussteinmassl/ComfyUI-DiffHDR"

[tool.comfy]
PublisherId = "claussteinmassl"
DisplayName = "ComfyUI-DiffHDR"
Icon = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
markers = ["requires_comfy: needs a ComfyUI checkout on COMFYUI_PATH"]
